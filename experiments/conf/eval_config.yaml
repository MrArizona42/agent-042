defaults:
  - eval/task: chat
  - eval/rag: default
  - eval/judge: gemini
  - eval/metrics: default
  - _self_

# ── Model ──
model:
  base_model: /models/Qwen/Qwen3-0.6B
  vllm_base_url: http://localhost:8000

# ── Adapter (nullable — omit or set to null for base model) ──
adapter:
  name: null
  version: null

# ── Eval ──
tier: regression

# dataset.name, dataset.split, dataset.max_examples are set by the task config
# (eval/task/*.yaml).  Only seed is a cross-task default.
dataset:
  seed: 42

# ── Generation ──
generation:
  temperature: 0.1
  top_p: 0.95
  max_tokens: 512

# ── Output ──
db_url: ${oc.env:GATEWAY_AGENT042_DB_URL}

hydra:
  run:
    dir: experiments/logs/eval-logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
