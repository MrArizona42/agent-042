]

airflow = [

]

airflow-worker = [
    # Eval metrics (bert-score, rouge, torch CPU)
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2.0",
    "datasets>=4.4.2",
    "numpy>=1.26",
    "mlflow-skinny>=3.8.1,<4",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.1",
    "httpx>=0.28.1",
    # RAG data pipelines
    "qdrant-client>=1.12.0",
    "langchain-text-splitters>=0.4.2",
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.2.0",
    "requests>=2.32.4",
