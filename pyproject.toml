    "dvc[s3]>=3.66.1",
]

# Base deps must be kept in sync with airflow-worker.
# This extra adds training deps on top for GPU-equipped workers.
airflow-worker-gpu = [
    # --- Airflow worker base (keep in sync with airflow-worker) ---
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2.0",
    "datasets>=4.4.2",
    "numpy>=1.26",
    "mlflow-skinny>=3.8.1,<4",
    "psycopg2-binary>=2.9,<3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.1",
    "httpx>=0.28.1",
    "qdrant-client>=1.12.0",
    "langchain-text-splitters>=0.4.2",
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.2.0",
    "requests>=2.32.4",
    "dvc[s3]>=3.66.1",
    # --- Training deps (GPU) ---
    "bitsandbytes>=0.49.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "peft>=0.18.1",
    "pytorch-lightning>=2.6.0",
