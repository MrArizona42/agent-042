# quick reminder
# optional dependencies - published with the package
# dependency groups - for local development workflows
# uv sync -> sync base + dev dependency group
# uv sync --no-dev -> sync base without dev group
# uv sync --group test (or --all-groups) -> sync with groups
# uv sync --extra foo (or --all-extras) -> sync with optional deps

[project]
name = "agent-042"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fire>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.35.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.12.0",
    "langchain-text-splitters>=0.4.2",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "authlib>=1.6.7",
    "PyJWT[crypto]>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

ui = [
    "streamlit>=1.41.1",
