    "langchain-text-splitters>=0.4.2",
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "pypdf>=5.2.0",
    "requests>=2.32.4",
]

embeddings = [
    "fastembed>=0.8.0",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.35.0",
    "sentence-transformers>=3.3.1",
    "pydantic-settings>=2.10.1",
]

reranker = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.35.0",
    "sentence-transformers>=3.3.1",
    "pydantic-settings>=2.10.1",
]

training = [
    "bert-score>=0.3.13",
    "bitsandbytes>=0.49.1",
    "datasets>=4.4.2",
    "dvc[gdrive,s3,ssh]>=3.66.1",
    "hf-xet>=1.2.0",
    "hydra-core>=1.3.2",
    "mlflow>=3.8.1",
    "ninja>=1.13.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "peft>=0.18.1",
    "python-dotenv>=1.0.1",
    "pytorch-lightning>=2.6.0",
    "torch>=2.9.0",
    "transformers>=4.57.3",
]

mlflow = [
    "mlflow>=3.8.1,<4",
    "psycopg2-binary>=2.9,<3",
    "boto3>=1.35,<2",
    "pydantic-settings>=2.10.1",
]

[dependency-groups]
test = [
    "pytest>=8.4.2",
]

lint = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
]

notebook = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.0",
]

dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "notebook" },
]



[tool.uv]
environments = [
    "python_full_version < '3.13'",
]
conflicts = [
    [
        { extra = "training" },
        { extra = "airflow" },
    ],
    [
        { extra = "training" },
        { extra = "airflow-worker" },
    ],
]

[tool.uv.pip]
torch-backend = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "E501", "F404"]
