# Canonical catalog for task routing, knowledge-base metadata,
# per-KB alias retrieval setup, source/benchmark adapters, and source instances.
#
# Conventions:
# - ids are canonical task / knowledge-base ids
# - each task owns an ordered knowledge_bases list
# - each KB alias declares complete desired state: a `build` block (artifacts
#   that must exist) and a `retrieve` block (how a release is queried)
# - source instance manifests live at
#   assets/rag_data/source_instances/<source_instance_id>/manifest.toml
# - omitted reranker means reranking is disabled for that alias, and
#   reranker_multiplier must then be 1
# - omitted build.sparse_encoder means a dense-only release; retrieve.strategy
#   "sparse"/"hybrid" require build.sparse_encoder
# - omitted lora_adapter.name / lora_adapter.alias means defaults apply while enabled = false
# - role allowed values: "corpus", "benchmark"

schema_version = 4

[[tasks]]
id = "chat"
description = "Open-ended ML/DL/AI/LLM research discussion, conceptual explanation, comparison, brainstorming, planning, and general Q&A that is not mainly code debugging and not a request to summarize provided text."
knowledge_bases = ["ml_papers_core"]
lora_adapter = { enabled = false }

[[tasks]]
id = "code"
description = "Programming help for ML systems: writing code, debugging tracebacks, refactoring, explaining APIs, fixing integration issues, and reasoning about implementation details."
knowledge_bases = ["pytorch_reference"]
lora_adapter = { enabled = false }

[[tasks]]
id = "summarize"
description = "Summarize or condense user-provided content into a shorter form such as TL;DR, bullets, outline, recap, or structured summary without relying on external knowledge retrieval."
knowledge_bases = []
lora_adapter = { enabled = false }

[[knowledge_bases]]
id = "ml_papers_core"
description = "Curated full-text ML/AI papers for literature-grounded discussion, including methods, architectures, experiments, benchmarks, theory, and literature-grounded answers."
update_strategy = "replace"
default_alias = "champion"

[knowledge_bases.aliases.champion.build.chunking]
strategy = "sentence"
chunk_size = 512
chunk_overlap = 64

[knowledge_bases.aliases.champion.build.dense_encoder]
model = "sentence-transformers/all-MiniLM-L6-v2"
dimension = 384

[knowledge_bases.aliases.champion.retrieve]
strategy = "dense"
top_k = 5
score_threshold = 0.35
reranker_multiplier = 1

[knowledge_bases.aliases.challenger.build.chunking]
strategy = "sentence"
chunk_size = 512
chunk_overlap = 64

[knowledge_bases.aliases.challenger.build.dense_encoder]
model = "sentence-transformers/all-MiniLM-L6-v2"
dimension = 384

[knowledge_bases.aliases.challenger.build.sparse_encoder]
model = "Qdrant/bm25"

[knowledge_bases.aliases.challenger.retrieve]
strategy = "hybrid"
top_k = 5
score_threshold = 0.01
reranker = "cross-encoder/ms-marco-MiniLM-L-6-v2"
reranker_multiplier = 4

[[knowledge_bases]]
id = "pytorch_reference"
description = "PyTorch documentation for coding assistance, including API reference, tutorials, tensors, autograd, modules, distributed training, and implementation guidance."
update_strategy = "replace"
default_alias = "champion"

[knowledge_bases.aliases.champion.build.chunking]
strategy = "sentence"
chunk_size = 512
chunk_overlap = 64

[knowledge_bases.aliases.champion.build.dense_encoder]
model = "sentence-transformers/all-MiniLM-L6-v2"
dimension = 384

[knowledge_bases.aliases.champion.retrieve]
strategy = "dense"
top_k = 5
score_threshold = 0.35
reranker_multiplier = 1

[knowledge_bases.aliases.challenger.build.chunking]
strategy = "sentence"
chunk_size = 512
chunk_overlap = 64

[knowledge_bases.aliases.challenger.build.dense_encoder]
model = "sentence-transformers/all-MiniLM-L6-v2"
dimension = 384

[knowledge_bases.aliases.challenger.build.sparse_encoder]
model = "Qdrant/bm25"

[knowledge_bases.aliases.challenger.retrieve]
strategy = "hybrid"
top_k = 5
score_threshold = 0.01
reranker = "cross-encoder/ms-marco-MiniLM-L-6-v2"
reranker_multiplier = 4

[[source_instances]]
id = "ml_papers_core.papers"
description = "Curated full-text ML/AI papers."
role = "corpus"
knowledge_base = "ml_papers_core"
adapter = { id = "generic.arxiv_paper", version = "1" }

[[source_instances]]
id = "pytorch_reference.docs"
description = "Official PyTorch documentation pages."
role = "corpus"
knowledge_base = "pytorch_reference"
adapter = { id = "generic.http_html", version = "1" }

[[source_adapters]]
id = "generic.arxiv_paper"
version = "1"
description = "Fetches arXiv papers and extracts PDF text sections."
factory = "rag.adapters.sources:make_arxiv_paper_adapter"

[[source_adapters]]
id = "generic.http_html"
version = "1"
description = "Fetches HTTP HTML pages and extracts readable text sections."
factory = "rag.adapters.sources:make_http_html_adapter"
