# Canonical operator registry for task routing, knowledge-base metadata,
# alias profiles, and per-task adapter wiring.
#
# Conventions in this file:
# - table keys are canonical ids for tasks and knowledge bases
# - omitted reranker means None
# - omitted adapter.name / adapter.alias means defaults apply while enabled = false

schema_version = 2

[tasks.chat]
enabled = true
label = "General knowledge"
routing_description = "Open-ended ML/DL/AI/LLM research discussion, conceptual explanation, comparison, brainstorming, planning, and general Q&A that is not mainly code debugging and not a request to summarize provided text."
kb_refs = ["arxiv"]

[tasks.chat.adapter]
enabled = false

[tasks.code]
enabled = true
label = "Coding assistance"
routing_description = "Programming help for ML systems: writing code, debugging tracebacks, refactoring, explaining APIs, fixing integration issues, and reasoning about implementation details."
kb_refs = ["pytorch_docs"]

[tasks.code.adapter]
enabled = false

[tasks.summarize]
enabled = true
label = "Summarization"
routing_description = "Summarize or condense user-provided content into a shorter form such as TL;DR, bullets, outline, recap, or structured summary without relying on external knowledge retrieval."
kb_refs = []

[tasks.summarize.adapter]
enabled = false

[knowledge_bases.arxiv]
enabled = true
label = "ArXiv papers (ML / AI theory)"
description = "Deep discussions about ML/AI theory and latest trends"
selection_description = "Research papers, recent ML/AI methods, architectures, experiments, benchmarks, theory, and literature-grounded answers."
update_strategy = "incremental"
default_alias = "champion"

[knowledge_bases.arxiv.aliases.champion]
profile = "champion"

[knowledge_bases.arxiv.aliases.challenger]
profile = "challenger"

[knowledge_bases.pytorch_docs]
enabled = true
label = "PyTorch docs"
description = "PyTorch documentation for coding assistance"
selection_description = "PyTorch API reference, tutorials, tensors, autograd, modules, distributed training, and library usage guidance for implementation questions."
update_strategy = "replace"
default_alias = "champion"

[knowledge_bases.pytorch_docs.aliases.champion]
profile = "champion"

[knowledge_bases.pytorch_docs.aliases.challenger]
profile = "challenger"

[alias_profiles.champion]
top_k = 5
score_threshold = 0.35
retrieval_strategy = "dense"
reranker_multiplier = 4

[alias_profiles.challenger]
top_k = 5
score_threshold = 0.01
reranker = "cross-encoder/ms-marco-MiniLM-L-6-v2"
retrieval_strategy = "hybrid"
reranker_multiplier = 4
