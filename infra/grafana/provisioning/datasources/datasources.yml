apiVersion: 1
datasources:
  - name: PostgreSQL
    type: postgres
    uid: postgres
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: agent042
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    editable: false
