# Nginx configuration for agent.antonlab.ru
#
# This config proxies requests to the agent-042 services:
# - UI (Streamlit) at /
# - Gateway API at /api/
# - MLflow at /mlflow/ (optional)
#
# Installation:
#   1. Copy to /etc/nginx/sites-available/agent.antonlab.ru
#   2. ln -s /etc/nginx/sites-available/agent.antonlab.ru /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# SSL Certificate (Let's Encrypt):
#   sudo certbot certonly --nginx -d agent.antonlab.ru

# Upstream definitions for load balancing / cleaner config
upstream streamlit_ui {
    server localhost:8501;
}

upstream gateway_api {
    server localhost:8080;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name agent.antonlab.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS on port 8443
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# Main HTTPS server (port 8443 - non-privileged)
server {
    listen 8443 ssl http2;
    server_name agent.antonlab.ru;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/agent.antonlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.antonlab.ru/privkey.pem;

    # SSL settings (modern configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/agent.antonlab.ru.access.log;
    error_log /var/log/nginx/agent.antonlab.ru.error.log;

    # =====================
    # Streamlit UI (main frontend)
    # =====================
    location / {
        proxy_pass http://streamlit_ui;
        proxy_http_version 1.1;

        # WebSocket support (required for Streamlit)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for long-running requests
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Streamlit specific paths
    location /_stcore/stream {
        proxy_pass http://streamlit_ui/_stcore/stream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # =====================
    # Gateway API
    # =====================
    location /api/ {
        # Strip /api prefix when forwarding to gateway
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://gateway_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for LLM inference (can be slow)
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 60;

        # Disable buffering for streaming responses
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Direct access to API docs
    location /docs {
        proxy_pass http://gateway_api/docs;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://gateway_api/openapi.json;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://gateway_api/health;
        proxy_http_version 1.1;
    }
}
