# Nginx configuration for agent.antonlab.ru
#
# Exposed services (HTTPS, single domain, path-based routing):
#   /               → Streamlit UI         (basic auth)
#   /api/           → Gateway API          (basic auth, closed for now)
#   /airflow/       → Apache Airflow       (own auth)
#   /jupyter/       → JupyterLab           (token auth)
#   /mlflow/        → MLflow Tracking      (basic auth)
#   /flower/        → Flower               (basic auth)
#   /redis-insight/ → RedisInsight          (basic auth)
#   /rabbitmq/      → RabbitMQ Management  (own auth)
#
# Internal-only (bound to 127.0.0.1 in docker-compose):
#   vLLM, Qdrant, Redis, RabbitMQ AMQP, PostgreSQL

# =====================
# Upstream definitions
# =====================
upstream streamlit_ui     { server 127.0.0.1:8501; }
upstream gateway_api      { server 127.0.0.1:9001; }
upstream airflow_web      { server 127.0.0.1:8080; }
upstream jupyter_web      { server 127.0.0.1:8888; }
upstream mlflow_web       { server 127.0.0.1:5050; }
upstream flower_web       { server 127.0.0.1:5555; }
upstream redisinsight_web { server 127.0.0.1:5540; }
upstream rabbitmq_mgmt    { server 127.0.0.1:15672; }

# =====================
# HTTP → HTTPS redirect
# =====================
server {
    listen 80;
    server_name agent.antonlab.ru;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS on port 8443
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# =====================
# Main HTTPS server (port 8443)
# =====================
server {
    listen 8443 ssl http2;
    server_name agent.antonlab.ru;

    # --- SSL certificates (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/agent.antonlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.antonlab.ru/privkey.pem;

    # --- SSL settings (modern configuration) ---
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers ---
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # --- Logging ---
    access_log /var/log/nginx/agent.antonlab.ru.access.log;
    error_log  /var/log/nginx/agent.antonlab.ru.error.log;

    # =========================================================================
    # Streamlit UI — root path (application-level auth via Gateway)
    # =========================================================================
    location / {
        proxy_pass         http://streamlit_ui;
        proxy_http_version 1.1;

        # WebSocket support (required by Streamlit)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Streamlit WebSocket endpoint
    location /_stcore/stream {
        proxy_pass         http://streamlit_ui/_stcore/stream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

    # =========================================================================
    # Auth routes — proxied to Gateway (no basic auth)
    # =========================================================================
    location /auth/ {
        proxy_pass         http://gateway_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 30;
    }

    # =========================================================================
    # Gateway API — /api/ (application-level auth via middleware)
    # The API itself serves at root; nginx strips the /api prefix.
    # =========================================================================
    location /api/ {
        # Strip /api prefix before forwarding to gateway
        rewrite ^/api(/.*)$ $1 break;

        proxy_pass         http://gateway_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Long timeouts for LLM inference
        proxy_read_timeout    300;
        proxy_send_timeout    300;
        proxy_connect_timeout 60;

        # Disable buffering for streaming responses
        proxy_buffering           off;
        chunked_transfer_encoding on;
    }

    # =========================================================================
    # Airflow — /airflow/ (own authentication)
    # Requires in docker-compose:
    #   AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX=true
    #   AIRFLOW__WEBSERVER__BASE_URL=https://agent.antonlab.ru:8443/airflow
    # Airflow 2.10+ with BASE_URL containing a path prefix expects the
    # prefix in incoming requests.  Do NOT strip it (no trailing / on proxy_pass).
    # =========================================================================
    location /airflow/ {
        proxy_pass         http://airflow_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 120;
    }

    # =========================================================================
    # Jupyter — /jupyter/ (token authentication)
    # Requires in docker-compose:
    #   command: start-notebook.py --ServerApp.base_url=/jupyter
    # Jupyter natively serves under the configured base_url prefix.
    # =========================================================================
    location /jupyter/ {
        proxy_pass         http://jupyter_web;
        proxy_http_version 1.1;

        # WebSocket support (required by Jupyter kernels)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

    # =========================================================================
    # MLflow — /mlflow/ (basic auth)
    # MLflow serves at root; nginx strips the /mlflow/ prefix (trailing /).
    # Host $host (without port) is required — MLflow's DNS rebinding
    # protection rejects host:port values even if listed in allowed_hosts.
    # =========================================================================
    location /mlflow/ {
        auth_basic           "Agent 042";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://mlflow_web/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /mlflow;
        proxy_redirect   off;
        proxy_buffering  off;

        proxy_read_timeout 120;
    }

    # =========================================================================
    # Flower — /flower/ (basic auth)
    # Requires in docker-compose:
    #   FLOWER_URL_PREFIX=/flower  environment variable
    # Flower natively serves under the configured url_prefix.
    # =========================================================================
    location /flower/ {
        auth_basic           "Agent 042";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://flower_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 120;
    }

    # =========================================================================
    # RedisInsight — /redis-insight/ (basic auth)
    # Requires in docker-compose:
    #   RI_PROXY_PATH=/redis-insight  environment variable
    # RedisInsight natively handles the proxy path prefix.
    # =========================================================================
    location /redis-insight/ {
        auth_basic           "Agent 042";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://redisinsight_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 120;
    }

    # =========================================================================
    # RabbitMQ Management — /rabbitmq/ (own authentication)
    # Requires in docker-compose:
    #   management.path_prefix = /rabbitmq  in mounted rabbitmq.conf
    # RabbitMQ natively serves under the configured path prefix.
    # =========================================================================
    location /rabbitmq/ {
        proxy_pass         http://rabbitmq_mgmt;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_read_timeout 120;
    }
}
