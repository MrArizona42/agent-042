services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    # Environment variables for Postgres initialization
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Persist database between restarts
    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - ml_platform

    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    build:
      context: ${PROJECT_ROOT}/docker/mlflow   # where Dockerfile lives
      dockerfile: Dockerfile

    # Runtime configuration (no secrets baked into image)
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}

      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}

      # Required for boto3 (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    # Public UI access
    ports:
      - "${MLFLOW_PORT}:5000"

    # Wait for postgres to be available
    depends_on:
      - postgres

    # Command extends ENTRYPOINT
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
#       - --serve-artifacts

    # Healthcheck for orchestration & future k8s readiness
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - ml_platform

    restart: unless-stopped

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:latest

    # Allow switching between HF ID and local path under /models
    environment:
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_DTYPE: ${VLLM_DTYPE}
      VLLM_QUANT: ${VLLM_QUANT}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE}
      HF_HOME: /models/.cache
    command: [
      "--model", "${VLLM_MODEL}",
      "--dtype", "${VLLM_DTYPE}",
      "--tensor-parallel-size", "${VLLM_GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM_GPU_UTIL}",
      "--kv-cache-dtype", "${VLLM_KV_CACHE_DTYPE}",
      "--quantization", "${VLLM_QUANT}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

    # Expose public API
    ports:
      - "${VLLM_PORT}:8000"

    # Mount repo models so you can set VLLM_MODEL to a local path e.g. /models/ministral/Ministral-3b-instruct
    volumes:
      - ${PROJECT_ROOT}/assets/models:/models:rw

    # GPU access via modern Compose syntax
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT}
              capabilities: [gpu]

    # Healthcheck against OpenAI models endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - ml_platform

    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: docker/gateway/Dockerfile

    environment:
      GATEWAY_VLLM_BASE_URL: ${GATEWAY_VLLM_BASE_URL}
      GATEWAY_DEFAULT_MODEL: ${VLLM_MODEL}

    ports:
      - "${GATEWAY_PORT}:9000"

    depends_on:
      - vllm

    networks:
      - ml_platform

    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: docker/ui/Dockerfile

    environment:
      GATEWAY_URL: ${GATEWAY_URL}

    ports:
      - "${UI_PORT}:8501"

    depends_on:
      - gateway

    networks:
      - ml_platform

    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:

# =====================
# Docker network
# =====================
networks:
  ml_platform:
    driver: bridge
