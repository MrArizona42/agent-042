services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    # Environment variables for Postgres initialization
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Persist database between restarts
    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - mlflow_db_net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    build:
      context: ${PROJECT_ROOT}   # where Dockerfile lives
      dockerfile: infra/docker/mlflow/Dockerfile

    # Runtime configuration (no secrets baked into image)
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}

      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}

      # Required for boto3 (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    # Public UI access
    ports:
      - "${MLFLOW_PORT}:5000"

    # Wait for postgres to be available
    depends_on:
      postgres:
        condition: service_healthy

    # Command extends ENTRYPOINT
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
#       - --serve-artifacts

    # Healthcheck for orchestration & future k8s readiness
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - mlflow_db_net

    restart: unless-stopped

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:latest

    # Allow switching between HF ID and local path under /models
    environment:
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_DTYPE: ${VLLM_DTYPE}
      VLLM_QUANT: ${VLLM_QUANT}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE}
      HF_HOME: /models/.cache
    command: [
      "--model", "${VLLM_MODEL}",
      "--dtype", "${VLLM_DTYPE}",
      "--tensor-parallel-size", "${VLLM_GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM_GPU_UTIL}",
      "--kv-cache-dtype", "${VLLM_KV_CACHE_DTYPE}",
      "--quantization", "${VLLM_QUANT}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

    # Expose public API
    ports:
      - "${VLLM_PORT}:8000"

    # Mount repo models so you can set VLLM_MODEL to a local path e.g. /models/ministral/Ministral-3b-instruct
    volumes:
      - ${PROJECT_ROOT}/assets/models:/models:rw

    # GPU access via modern Compose syntax
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT}
              capabilities: [gpu]

    # Healthcheck against OpenAI models endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${VLLM_PORT}/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Qdrant Vector Database
  # =====================
  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "${QDRANT_PORT}:6333"
      - "6334:6334"  # gRPC port

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend_net

    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10

    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/gateway/Dockerfile

    environment:
      GATEWAY_VLLM_BASE_URL: ${GATEWAY_VLLM_BASE_URL}
      GATEWAY_DEFAULT_MODEL: ${VLLM_MODEL}
      GATEWAY_QDRANT_HOST: ${GATEWAY_QDRANT_HOST}
      GATEWAY_QDRANT_PORT: ${GATEWAY_QDRANT_PORT}
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}

    ports:
      - "${GATEWAY_PORT}:9000"

    depends_on:
      vllm:
        condition: service_healthy
      qdrant:
        # condition: service_healthy
        condition: service_started

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - backend_net
      - frontend_net

    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/ui/Dockerfile

    environment:
      GATEWAY_URL: ${GATEWAY_URL}

    ports:
      - "${UI_PORT}:8501"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend_net

    restart: unless-stopped

  # =====================
  # Airflow – database migration & admin user (one-shot)
  # =====================
  airflow-init:
    image: apache/airflow:2.10.4
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python <<'PYEOF'
        import psycopg2, os
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        conn = psycopg2.connect(host="postgres", port=5432,
                                user=os.environ["PG_USER"],
                                password=os.environ["PG_PASSWORD"],
                                dbname=os.environ["PG_DB"])
        conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = conn.cursor()
        db = os.environ["AIRFLOW_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
        if not cur.fetchone():
            cur.execute('CREATE DATABASE "{}"'.format(db))
            print("Created database " + db)
        else:
            print("Database " + db + " already exists")
        conn.close()
        PYEOF
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER} \
          --password $${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Postgres connection for automatic DB creation
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlflow_db_net
    restart: "no"

  # =====================
  # Airflow Webserver
  # =====================
  airflow-webserver:
    image: apache/airflow:2.10.4
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # Airflow Scheduler (LocalExecutor)
  # =====================
  airflow-scheduler:
    image: apache/airflow:2.10.4
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # JupyterLab
  # =====================
  jupyter:
    image: quay.io/jupyter/minimal-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ${PROJECT_ROOT}/notebooks:/home/jovyan/work
      - ${PROJECT_ROOT}/src:/home/jovyan/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:
  qdrant_data:
  airflow_logs:

# =====================
# Docker network
# =====================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  mlflow_db_net:
    driver: bridge
