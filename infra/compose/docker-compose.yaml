# =====================
# Reusable fragments
# =====================

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Limit parallel DAG runs to reduce DB + disk pressure
  AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "3"
  # How often (seconds) the scheduler cleans up stale parsing metadata
  AIRFLOW__SCHEDULER__PARSING_CLEANUP_INTERVAL: "60"
  # Project paths & service endpoints used by DAGs
  PROJECT_ROOT: /opt/airflow/project
  QDRANT_HOST: qdrant
  QDRANT_PORT: ${QDRANT_PORT}
  EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}
  GATEWAY_EMBEDDINGS_URL: http://embeddings:8100
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

x-airflow-common-build: &airflow-common-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow/Dockerfile

x-airflow-common-volumes: &airflow-common-volumes
  - ${PROJECT_ROOT}/dags:/opt/airflow/dags
  - ${PROJECT_ROOT}:/opt/airflow/project
  - airflow_logs:/opt/airflow/logs

services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    # Docker default shm is 64 MB; PostgreSQL needs more for shared buffers.
    shm_size: 256m

    # Limit WAL / checkpoint disk usage to prevent "No space left on device".
    command:
      - postgres
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
      - -c
      - wal_keep_size=0
      - -c
      - checkpoint_completion_target=0.9

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - mlflow_db_net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/mlflow/Dockerfile

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
      # S3 credentials (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "127.0.0.1:${MLFLOW_PORT}:5000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
      - --allowed-hosts
      - "agent.antonlab.ru,localhost"
      # - --serve-artifacts

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - mlflow_db_net

    restart: unless-stopped

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:v0.16.0

    environment:
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_DTYPE: ${VLLM_DTYPE}
      VLLM_QUANT: ${VLLM_QUANT}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE}
      HF_HOME: /models/.cache

    command: [
      "--model", "${VLLM_MODEL}",
      "--dtype", "${VLLM_DTYPE}",
      "--tensor-parallel-size", "${VLLM_GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM_GPU_UTIL}",
      "--kv-cache-dtype", "${VLLM_KV_CACHE_DTYPE}",
      "--quantization", "${VLLM_QUANT}",
      "--enable-lora",
      "--max-loras", "${VLLM_MAX_LORAS}",
      "--max-lora-rank", "${VLLM_MAX_LORA_RANK}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

    ports:
      - "127.0.0.1:${VLLM_PORT}:8000"

    # Mount repo models and downloaded adapters
    volumes:
      - ${PROJECT_ROOT}/assets/models:/models:rw
      - ${PROJECT_ROOT}/assets/adapters:/adapters:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT}
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Qdrant Vector Database
  # =====================
  qdrant:
    image: qdrant/qdrant:v1.17.0

    ports:
      - "127.0.0.1:${QDRANT_PORT}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # =====================
  # RabbitMQ Message Broker
  # =====================
  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ${PROJECT_ROOT}/infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-path-prefix.conf:ro

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # =====================
  # Redis (Pub/Sub for streaming)
  # =====================
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # =====================
  # Embeddings Service (sentence-transformers)
  # =====================
  embeddings:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/embeddings/Dockerfile

    environment:
      EMBEDDINGS_MODEL: ${GATEWAY_EMBEDDING_MODEL}
      EMBEDDINGS_DEVICE: ${EMBEDDINGS_DEVICE:-cpu}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Celery Worker (LLM Task Execution)
  # =====================
  celery-worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/celery/Dockerfile

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      VLLM_BASE_URL: http://vllm:8000
      VLLM_MODEL: ${VLLM_MODEL}

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/gateway/Dockerfile

    environment:
      GATEWAY_VLLM_BASE_URL: ${GATEWAY_VLLM_BASE_URL}
      GATEWAY_DEFAULT_MODEL: ${VLLM_MODEL}
      GATEWAY_QDRANT_HOST: ${GATEWAY_QDRANT_HOST}
      GATEWAY_QDRANT_PORT: ${GATEWAY_QDRANT_PORT}
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}
      GATEWAY_EMBEDDINGS_URL: http://embeddings:8100
      GATEWAY_ASYNC_ENABLED: ${GATEWAY_ASYNC_ENABLED}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      # OAuth2 / OIDC
      GATEWAY_GOOGLE_CLIENT_ID: ${GATEWAY_GOOGLE_CLIENT_ID:-}
      GATEWAY_GOOGLE_CLIENT_SECRET: ${GATEWAY_GOOGLE_CLIENT_SECRET:-}
      GATEWAY_GOOGLE_REDIRECT_URI: ${GATEWAY_GOOGLE_REDIRECT_URI:-}
      GATEWAY_AGENT042_DB_URL: ${GATEWAY_AGENT042_DB_URL:-}
      GATEWAY_SESSION_SECRET_KEY: ${GATEWAY_SESSION_SECRET_KEY:-}
      GATEWAY_SESSION_TTL_SECONDS: ${GATEWAY_SESSION_TTL_SECONDS:-86400}

    ports:
      - "127.0.0.1:${GATEWAY_PORT}:9000"

    depends_on:
      vllm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - backend_net
      - frontend_net
      - mlflow_db_net

    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/ui/Dockerfile

    environment:
      GATEWAY_URL: ${GATEWAY_URL}

    ports:
      - "127.0.0.1:${UI_PORT}:8501"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend_net

    restart: unless-stopped

  # =====================
  # Flower (Celery Monitoring)
  # =====================
  flower:
    image: mher/flower:2.0

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      FLOWER_PORT: 5555
      FLOWER_URL_PREFIX: /flower

    ports:
      - "127.0.0.1:${FLOWER_PORT}:5555"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # RedisInsight (Redis Monitoring)
  # =====================
  redisinsight:
    image: redis/redisinsight:3.2.0

    environment:
      RI_PROXY_PATH: /redis-insight

    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT}:5540"

    volumes:
      - redisinsight_data:/data

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend_net

  # Airflow – ensure RAG output directories are writable (one-shot)
  # The project root is bind-mounted from the host, so files keep the
  # host UID.  The airflow user inside the container (UID 50000) cannot
  # write to those directories.  This service runs as root to create
  # the directories and hand ownership to the airflow user.
  # =====================
  airflow-prepare-dirs:
    build: *airflow-common-build
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/project/assets/rag_data/arxiv
        mkdir -p /opt/airflow/project/assets/rag_data/pytorch_docs
        chown -R 50000:0 /opt/airflow/project/assets/rag_data
        chmod -R 775 /opt/airflow/project/assets/rag_data
        # DVC uses .dvc/tmp/lock and other temp files during `dvc add/push`
        mkdir -p /opt/airflow/project/.dvc/tmp
        chown -R 50000:0 /opt/airflow/project/.dvc
        chmod -R 775 /opt/airflow/project/.dvc
        echo "RAG data & DVC directories prepared."
    volumes:
      - ${PROJECT_ROOT}:/opt/airflow/project
    restart: "no"

  # Airflow – database migration & admin user (one-shot)
  # =====================
  airflow-init:
    build: *airflow-common-build
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python <<'PYEOF'
        import os
        import psycopg2
        from psycopg2 import sql
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        conn = psycopg2.connect(host="postgres", port=5432,
                                user=os.environ["PG_USER"],
                                password=os.environ["PG_PASSWORD"],
                                dbname=os.environ["PG_DB"])
        conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = conn.cursor()
        db = os.environ["AIRFLOW_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
            print("Created database " + db)
        else:
            print("Database " + db + " already exists")
        # Also create the agent042 application database
        cur.execute("SELECT 1 FROM pg_database WHERE datname = 'agent042'")
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier("agent042")))
            print("Created database agent042")
        else:
            print("Database agent042 already exists")
        conn.close()
        PYEOF
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER} \
          --password $${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Postgres connection for automatic DB creation
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlflow_db_net
    restart: "no"

  # =====================
  # Airflow Webserver
  # =====================
  airflow-webserver:
    build: *airflow-common-build
    command: webserver
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__WEBSERVER__BASE_URL: https://agent.antonlab.ru:8443/airflow
    ports:
      - "127.0.0.1:${AIRFLOW_PORT}:8080"
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/airflow/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # Airflow Scheduler (LocalExecutor)
  # =====================
  airflow-scheduler:
    build: *airflow-common-build
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # JupyterLab
  # =====================
  jupyter:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/jupyter/Dockerfile
    command: start-notebook.py --ServerApp.base_url=/jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      # Makes train_adapter a proper importable package inside notebooks
      PYTHONPATH: /home/jovyan/work/experiments/scripts
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:8888"
    volumes:
      - ${PROJECT_ROOT}/experiments:/home/jovyan/experiments:rw
      - ${PROJECT_ROOT}/assets:/home/jovyan/assets:rw
      - ${PROJECT_ROOT}/dags:/home/jovyan/dags:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/jupyter/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  redisinsight_data:
  airflow_logs:

# =====================
# Docker networks
# =====================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  mlflow_db_net:
    driver: bridge
