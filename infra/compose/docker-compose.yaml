# =====================
# Reusable fragments
# =====================

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-airflow}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/airflow/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-airflow_jwt_secret}
  AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_JWT_ISSUER:-airflow}
  # Shared key for signing worker log-fetch JWTs (HS512).  Without this,
  # each container auto-generates a random key and the webserver cannot
  # read task logs from the worker (InvalidSignatureError).
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:-airflow_jwt_secret}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"


  # Project paths & service endpoints used by DAGs
  PROJECT_ROOT: /opt/airflow/project
  QDRANT_HOST: qdrant
  QDRANT_PORT: ${QDRANT_PORT}
  EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}
  GATEWAY_EMBEDDINGS_URL: http://embeddings:8100
  EVAL_GATEWAY_URL: http://gateway:9000
  EVAL_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY}
  EVAL_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/agent042
  # MLflow Model Registry — used by eval runner to resolve LoRA aliases
  REGISTRY_MLFLOW_TRACKING_URI: http://mlflow:5000
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

x-airflow-common-build: &airflow-common-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow/Dockerfile

x-airflow-worker-build: &airflow-worker-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow-worker/Dockerfile

x-airflow-common-volumes: &airflow-common-volumes
  - ${PROJECT_ROOT}/dags:/opt/airflow/dags
  - ${PROJECT_ROOT}:/opt/airflow/project
  - airflow_logs:/opt/airflow/logs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    # Docker default shm is 64 MB; PostgreSQL needs more for shared buffers.
    shm_size: 256m

    # Limit WAL / checkpoint disk usage to prevent "No space left on device".
    command:
      - postgres
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
      - -c
      - wal_keep_size=0
      - -c
      - checkpoint_completion_target=0.9

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - mlflow_db_net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/mlflow/Dockerfile

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
      # S3 credentials (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "127.0.0.1:${MLFLOW_PORT}:5000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
      - --allowed-hosts
      - ${MLFLOW_SERVER_ALLOWED_HOSTS}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - mlflow_db_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # LoRA adapter sync
  # Downloads aliased adapters from MLflow Model Registry and
  # hot-loads them into the running vLLM via its REST API.
  # =====================
  vllm-adapter-sync:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/adapter-sync/Dockerfile

    environment:
      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      REGISTRY_ADAPTERS_DIR: /adapters
      REGISTRY_VLLM_BASE_URL: http://vllm:8000
      REGISTRY_SYNC_ALIASES: ${REGISTRY_SYNC_ALIASES:-champion,challenger}

    volumes:
      - ${PROJECT_ROOT}/assets/adapters:/adapters:rw

    depends_on:
      vllm:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    networks:
      - mlflow_db_net
      - backend_net

    logging: *default-logging
    restart: "no"

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:v0.16.0

    environment:
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_DTYPE: ${VLLM_DTYPE}
      VLLM_QUANT: ${VLLM_QUANT}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE}
      HF_HOME: /models/.cache
      # Prioritise host-injected NVIDIA driver libs over the CUDA compat stubs
      # bundled inside the image (prevents Error 803 when host driver is newer).
      LD_LIBRARY_PATH: /lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
      # Allow loading/unloading LoRA adapters at runtime via the API
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: "true"

    command: [
      "--model", "${VLLM_MODEL}",
      "--dtype", "${VLLM_DTYPE}",
      "--tensor-parallel-size", "${VLLM_GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM_GPU_UTIL}",
      "--kv-cache-dtype", "${VLLM_KV_CACHE_DTYPE}",
      "--quantization", "${VLLM_QUANT}",
      "--enable-lora",
      "--max-loras", "${VLLM_MAX_LORAS}",
      "--max-lora-rank", "${VLLM_MAX_LORA_RANK}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

    ports:
      - "127.0.0.1:${VLLM_PORT}:8000"

    volumes:
      - ${PROJECT_ROOT}/assets/models:/models:rw
      - ${PROJECT_ROOT}/assets/adapters:/adapters:rw

    depends_on:
      mlflow:
        condition: service_healthy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT}
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Qdrant Vector Database
  # =====================
  qdrant:
    image: qdrant/qdrant:v1.17.0

    ports:
      - "127.0.0.1:${QDRANT_PORT}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # RabbitMQ Message Broker
  # =====================
  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ${PROJECT_ROOT}/infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-path-prefix.conf:ro

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Redis (Pub/Sub for streaming)
  # =====================
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Embeddings Service (sentence-transformers)
  # =====================
  embeddings:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/embeddings/Dockerfile

    environment:
      EMBEDDINGS_MODEL: ${GATEWAY_EMBEDDING_MODEL}
      EMBEDDINGS_DEVICE: ${EMBEDDINGS_DEVICE:-cpu}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Celery Worker (LLM Task Execution)
  # =====================
  celery-worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/celery/Dockerfile

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      VLLM_BASE_URL: http://vllm:8000
      VLLM_MODEL: ${VLLM_MODEL}

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow Celery Worker
  # Runs ALL DAG tasks: evaluation (bert-score, torch CPU),
  # RAG data pipelines (arxiv, qdrant, dvc), collection cleanup.
  # Uses a fat image with all task dependencies pre-installed.
  # =====================
  airflow-worker:
    build: *airflow-worker-build
    # Low concurrency: eval tasks (BERTScore, etc.) load large models into RAM.
    # The default (== CPU count) causes OOM kills.
    command: celery worker --concurrency 2
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - ${PROJECT_ROOT}:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      # yamllint enable rule:line-length
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
      - sandbox_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow GPU Worker (Celery) – routes the "gpu" queue
  # Uses the same image as airflow-worker with GPU training deps.
  # Concurrency 1: each training job needs exclusive GPU access.
  # =====================
  airflow-worker-gpu:
    build: *airflow-worker-build
    command: celery worker --queues gpu --concurrency 1
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - ${PROJECT_ROOT}:/opt/airflow/project
      - airflow_logs:/opt/airflow/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      # yamllint enable rule:line-length
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
      - sandbox_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Code execution sandbox sidecar
  # =====================
  code-sandbox:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/code-sandbox/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SANDBOX_PORT: "8200"
    cpus: 1.0
    mem_limit: 256m
    # Isolated network — only reachable by airflow-worker, no internet.
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/gateway/Dockerfile

    environment:
      GATEWAY_VLLM_BASE_URL: ${GATEWAY_VLLM_BASE_URL}
      GATEWAY_DEFAULT_MODEL: ${VLLM_MODEL}
      GATEWAY_QDRANT_HOST: ${GATEWAY_QDRANT_HOST}
      GATEWAY_QDRANT_PORT: ${GATEWAY_QDRANT_PORT}
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}
      GATEWAY_EMBEDDINGS_URL: http://embeddings:8100
      GATEWAY_ASYNC_ENABLED: ${GATEWAY_ASYNC_ENABLED}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      # OAuth2 / OIDC
      GATEWAY_GOOGLE_CLIENT_ID: ${GATEWAY_GOOGLE_CLIENT_ID:-}
      GATEWAY_GOOGLE_CLIENT_SECRET: ${GATEWAY_GOOGLE_CLIENT_SECRET:-}
      GATEWAY_GOOGLE_REDIRECT_URI: ${GATEWAY_GOOGLE_REDIRECT_URI:-}
      GATEWAY_AGENT042_DB_URL: ${GATEWAY_AGENT042_DB_URL:-}
      GATEWAY_SESSION_SECRET_KEY: ${GATEWAY_SESSION_SECRET_KEY:-}
      GATEWAY_SESSION_TTL_SECONDS: ${GATEWAY_SESSION_TTL_SECONDS:-86400}
      GATEWAY_INTERNAL_API_KEY: ${GATEWAY_INTERNAL_API_KEY:-}

    ports:
      - "127.0.0.1:${GATEWAY_PORT}:9000"

    depends_on:
      vllm:
        condition: service_healthy
      vllm-adapter-sync:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - backend_net
      - frontend_net
      - mlflow_db_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/ui/Dockerfile

    environment:
      GATEWAY_URL: ${GATEWAY_URL}

    ports:
      - "127.0.0.1:${UI_PORT}:8501"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Flower (Celery Monitoring)
  # =====================
  flower:
    image: mher/flower:2.0

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      FLOWER_PORT: 5555
      FLOWER_URL_PREFIX: /flower

    ports:
      - "127.0.0.1:${FLOWER_PORT}:5555"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # RedisInsight (Redis Monitoring)
  # =====================
  redisinsight:
    image: redis/redisinsight:3.2.0

    environment:
      RI_PROXY_PATH: /redis-insight

    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT}:5540"

    volumes:
      - redisinsight_data:/data

    depends_on:
      redis:
        condition: service_healthy

    logging: *default-logging

    networks:
      - backend_net

  # Airflow – ensure RAG output directories are writable (one-shot)
  # The project root is bind-mounted from the host, so files keep the
  # host UID.  The airflow user inside the container (UID 50000) cannot
  # write to those directories.  This service runs as root to create
  # the directories and hand ownership to the airflow user.
  # =====================
  airflow-prepare-dirs:
    build: *airflow-common-build
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/project/assets/rag_data/arxiv
        mkdir -p /opt/airflow/project/assets/rag_data/pytorch_docs
        chown -R 50000:0 /opt/airflow/project/assets/rag_data
        chmod -R 775 /opt/airflow/project/assets/rag_data
        # DVC uses .dvc/tmp/lock and other temp files during `dvc add/push`
        mkdir -p /opt/airflow/project/.dvc/tmp
        chown -R 50000:0 /opt/airflow/project/.dvc
        chmod -R 775 /opt/airflow/project/.dvc
        echo "RAG data & DVC directories prepared."
    volumes:
      - ${PROJECT_ROOT}:/opt/airflow/project
    logging: *default-logging
    restart: "no"

  # Airflow – database migration & admin user (one-shot)
  # =====================
  airflow-init:
    build: *airflow-common-build
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        python <<'PYEOF'
        import os
        import psycopg2
        from psycopg2 import sql
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        conn = psycopg2.connect(host="postgres", port=5432,
                                user=os.environ["PG_USER"],
                                password=os.environ["PG_PASSWORD"],
                                dbname=os.environ["PG_DB"])
        conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = conn.cursor()
        db = os.environ["AIRFLOW_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
            print("Created database " + db)
        else:
            print("Database " + db + " already exists")
        # Also create the agent042 application database
        cur.execute("SELECT 1 FROM pg_database WHERE datname = 'agent042'")
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier("agent042")))
            print("Created database agent042")
        else:
            print("Database agent042 already exists")
        conn.close()
        PYEOF
        # SimpleAuthManager stores credentials in a JSON file.
        # Seed it from .env so credentials stay deterministic across restarts.
        python <<'PYEOF'
        import json
        import os
        from pathlib import Path

        username = os.environ["AIRFLOW_ADMIN_USER"]
        password = os.environ["AIRFLOW_ADMIN_PASSWORD"]
        path = Path(os.environ["AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE"])
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps({username: password}) + "\n", encoding="utf-8")
        print(f"Seeded SimpleAuthManager password file at {path}")
        PYEOF
        airflow db migrate
        # Airflow 3 uses simple auth manager by default (users from config).
        # If FAB users CLI is available, keep compatibility with old flow.
        if airflow users --help >/dev/null 2>&1; then
          airflow users create \
            --username $${AIRFLOW_ADMIN_USER} \
            --password $${AIRFLOW_ADMIN_PASSWORD} \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com || echo "Admin user already exists; continuing."
        else
          echo "Skipping legacy 'airflow users create' (not available in this Airflow build)."
          echo "Configured simple auth manager user via AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS."
        fi
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/airflow/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-airflow_jwt_secret}
      AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW_JWT_ISSUER:-airflow}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:-airflow_jwt_secret}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-airflow}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
      # Postgres connection for automatic DB creation
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB}
    volumes:
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: "no"

  # =====================
  # Airflow Webserver
  # =====================
  airflow-webserver:
    build: *airflow-common-build
    command: api-server
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__API__BASE_URL: https://agent.antonlab.ru:8443/airflow
    ports:
      - "127.0.0.1:${AIRFLOW_PORT}:8080"
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow Scheduler (CeleryExecutor)
  # =====================
  airflow-dag-processor:
    build: *airflow-common-build
    command: dag-processor
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  airflow-scheduler:
    build: *airflow-common-build
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-prepare-dirs:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # JupyterLab
  # =====================
  jupyter:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/jupyter/Dockerfile
    command: start-notebook.py --ServerApp.base_url=/jupyter
    environment:
      PROJECT_ROOT: /home/jovyan
      PYTHONPATH: /home/jovyan:/home/jovyan/src
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      # Qdrant / embeddings are reached over the internal Docker network.
      QDRANT_HOST: qdrant
      QDRANT_PORT: ${QDRANT_PORT}
      EMBEDDINGS_URL: http://embeddings:8100
      # PostgreSQL — used by diagnostics/analytics notebooks
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # MLflow — direct container-to-container access (no auth needed)
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # S3 / Yandex Object Storage — needed for artifact upload/download
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    ports:
      - "127.0.0.1:${JUPYTER_PORT}:8888"
    volumes:
      - ${PROJECT_ROOT}/src:/home/jovyan/src:ro
      - ${PROJECT_ROOT}/experiments:/home/jovyan/experiments:rw
      - ${PROJECT_ROOT}/assets:/home/jovyan/assets:rw
      - ${PROJECT_ROOT}/dags:/home/jovyan/dags:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/jupyter/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
      - mlflow_db_net   # allows direct http://mlflow:5000 access without credentials
    logging: *default-logging
    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  redisinsight_data:
  airflow_logs:

# =====================
# Docker networks
# =====================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  mlflow_db_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true   # no outbound internet access from this network
