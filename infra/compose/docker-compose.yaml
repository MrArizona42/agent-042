# =====================
# Reusable fragments
# =====================

x-network-env: &network-env
  NETWORK__POSTGRES__INTERNAL_HOST: ${NETWORK__POSTGRES__INTERNAL_HOST}
  NETWORK__POSTGRES__INTERNAL_PORT: ${NETWORK__POSTGRES__INTERNAL_PORT}
  NETWORK__POSTGRES__HOST_PORT: ${NETWORK__POSTGRES__HOST_PORT}
  NETWORK__MLFLOW__INTERNAL_HOST: ${NETWORK__MLFLOW__INTERNAL_HOST}
  NETWORK__MLFLOW__SCHEME: ${NETWORK__MLFLOW__SCHEME}
  NETWORK__MLFLOW__INTERNAL_PORT: ${NETWORK__MLFLOW__INTERNAL_PORT}
  NETWORK__MLFLOW__HOST_PORT: ${NETWORK__MLFLOW__HOST_PORT}
  NETWORK__VLLM__INTERNAL_HOST: ${NETWORK__VLLM__INTERNAL_HOST}
  NETWORK__VLLM__SCHEME: ${NETWORK__VLLM__SCHEME}
  NETWORK__VLLM__INTERNAL_PORT: ${NETWORK__VLLM__INTERNAL_PORT}
  NETWORK__VLLM__HOST_PORT: ${NETWORK__VLLM__HOST_PORT}
  NETWORK__QDRANT_HTTP__INTERNAL_HOST: ${NETWORK__QDRANT_HTTP__INTERNAL_HOST}
  NETWORK__QDRANT_HTTP__INTERNAL_PORT: ${NETWORK__QDRANT_HTTP__INTERNAL_PORT}
  NETWORK__QDRANT_HTTP__HOST_PORT: ${NETWORK__QDRANT_HTTP__HOST_PORT}
  NETWORK__QDRANT_GRPC__INTERNAL_HOST: ${NETWORK__QDRANT_GRPC__INTERNAL_HOST}
  NETWORK__QDRANT_GRPC__INTERNAL_PORT: ${NETWORK__QDRANT_GRPC__INTERNAL_PORT}
  NETWORK__QDRANT_GRPC__HOST_PORT: ${NETWORK__QDRANT_GRPC__HOST_PORT}
  NETWORK__RABBITMQ_AMQP__INTERNAL_HOST: ${NETWORK__RABBITMQ_AMQP__INTERNAL_HOST}
  NETWORK__RABBITMQ_AMQP__INTERNAL_PORT: ${NETWORK__RABBITMQ_AMQP__INTERNAL_PORT}
  NETWORK__RABBITMQ_AMQP__HOST_PORT: ${NETWORK__RABBITMQ_AMQP__HOST_PORT}
  NETWORK__REDIS__INTERNAL_HOST: ${NETWORK__REDIS__INTERNAL_HOST}
  NETWORK__REDIS__INTERNAL_PORT: ${NETWORK__REDIS__INTERNAL_PORT}
  NETWORK__REDIS__HOST_PORT: ${NETWORK__REDIS__HOST_PORT}
  NETWORK__REDPANDA_KAFKA__INTERNAL_HOST: ${NETWORK__REDPANDA_KAFKA__INTERNAL_HOST}
  NETWORK__REDPANDA_KAFKA__INTERNAL_PORT: ${NETWORK__REDPANDA_KAFKA__INTERNAL_PORT}
  NETWORK__REDPANDA_KAFKA__HOST_PORT: ${NETWORK__REDPANDA_KAFKA__HOST_PORT}
  NETWORK__EMBEDDINGS__INTERNAL_HOST: ${NETWORK__EMBEDDINGS__INTERNAL_HOST}
  NETWORK__EMBEDDINGS__SCHEME: ${NETWORK__EMBEDDINGS__SCHEME}
  NETWORK__EMBEDDINGS__INTERNAL_PORT: ${NETWORK__EMBEDDINGS__INTERNAL_PORT}
  NETWORK__RERANKER__INTERNAL_HOST: ${NETWORK__RERANKER__INTERNAL_HOST}
  NETWORK__RERANKER__SCHEME: ${NETWORK__RERANKER__SCHEME}
  NETWORK__RERANKER__INTERNAL_PORT: ${NETWORK__RERANKER__INTERNAL_PORT}
  NETWORK__CODE_SANDBOX__INTERNAL_HOST: ${NETWORK__CODE_SANDBOX__INTERNAL_HOST}
  NETWORK__CODE_SANDBOX__SCHEME: ${NETWORK__CODE_SANDBOX__SCHEME}
  NETWORK__CODE_SANDBOX__INTERNAL_PORT: ${NETWORK__CODE_SANDBOX__INTERNAL_PORT}
  NETWORK__GATEWAY__INTERNAL_HOST: ${NETWORK__GATEWAY__INTERNAL_HOST}
  NETWORK__GATEWAY__SCHEME: ${NETWORK__GATEWAY__SCHEME}
  NETWORK__GATEWAY__INTERNAL_PORT: ${NETWORK__GATEWAY__INTERNAL_PORT}
  NETWORK__GATEWAY__HOST_PORT: ${NETWORK__GATEWAY__HOST_PORT}

x-config-path-env: &config-path-env
  CONFIG__RUNTIME_PATH: /opt/agent/runtime.toml
  CONFIG__CATALOG_PATH: /opt/agent/catalog.toml
  VLLM__MODEL: ${VLLM__MODEL}

x-config-volumes: &config-volumes
  - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
  - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro

x-shared-root-volumes: &shared-root-volumes
  datasets: &shared-datasets-volume ${SHARED_ROOT}/assets/datasets:/opt/airflow/project/assets/datasets
  rag_data: &shared-rag-data-volume ${SHARED_ROOT}/assets/rag_data:/opt/airflow/project/assets/rag_data
  training_artifacts: &shared-training-artifacts-volume ${SHARED_ROOT}/artifacts/training:/opt/airflow/project/artifacts/training
  dvc_config: &shared-dvc-config-volume ${SHARED_ROOT}/.dvc/config.local:/opt/airflow/project/.dvc/config.local:ro

x-s3-client-env: &s3-client-env
  MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

x-postgres-client-env: &postgres-client-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_APP_DB: ${POSTGRES_APP_DB}

x-rabbitmq-client-env: &rabbitmq-client-env
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

x-runtime-secret-env: &runtime-secret-env
  GATEWAY__API_KEY: ${GATEWAY__API_KEY}
  AUTH__GOOGLE_CLIENT_ID: ${AUTH__GOOGLE_CLIENT_ID}
  AUTH__GOOGLE_CLIENT_SECRET: ${AUTH__GOOGLE_CLIENT_SECRET}
  AUTH__GOOGLE_REDIRECT_URI: ${PUBLIC__BASE_URL}${PUBLIC__AUTH_CALLBACK_PATH}
  AUTH__SESSION_SECRET_KEY: ${AUTH__SESSION_SECRET_KEY}
  AUTH__INTERNAL_API_KEY: ${AUTH__INTERNAL_API_KEY}
  EVAL__JUDGE__API_KEY: ${EVAL__JUDGE__API_KEY}

x-observability-env: &observability-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://${NETWORK__OTEL_COLLECTOR_GRPC__INTERNAL_HOST}:${NETWORK__OTEL_COLLECTOR_GRPC__INTERNAL_PORT}
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG}

x-airflow-common-env: &airflow-common-env
  <<: [*network-env, *config-path-env, *runtime-secret-env, *s3-client-env, *postgres-client-env, *rabbitmq-client-env]
  AIRFLOW__CORE__EXECUTOR: CeleryExecutor
  AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${NETWORK__RABBITMQ_AMQP__INTERNAL_HOST}:${NETWORK__RABBITMQ_AMQP__INTERNAL_PORT}//
  AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_AIRFLOW_DB}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_AIRFLOW_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${NETWORK__AIRFLOW_WEBSERVER__SCHEME}://${NETWORK__AIRFLOW_WEBSERVER__INTERNAL_HOST}:${NETWORK__AIRFLOW_WEBSERVER__INTERNAL_PORT}${PUBLIC__AIRFLOW_PATH}/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER}
  # Shared key for signing worker log-fetch JWTs (HS512).  Without this,
  # each container auto-generates a random key and the webserver cannot
  # read task logs from the worker (InvalidSignatureError).
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API_AUTH__JWT_SECRET}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"


  # Project paths & service endpoints used by DAGs
  CONTAINER__PROJECT_ROOT: /opt/airflow/project
  GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}
  GITHUB_DATA_SYNC_TOKEN: ${GITHUB_DATA_SYNC_TOKEN}

x-airflow-common-build: &airflow-common-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow/Dockerfile

x-airflow-common-image: &airflow-common-image "ghcr.io/${GITHUB_REPOSITORY}-airflow:${IMAGE_TAG}"

x-airflow-worker-build: &airflow-worker-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow-worker/Dockerfile

x-airflow-worker-image: &airflow-worker-image "ghcr.io/${GITHUB_REPOSITORY}-airflow-worker:${IMAGE_TAG}"

x-rag-ops-build: &rag-ops-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow-worker/Dockerfile

x-rag-ops-image: &rag-ops-image "ghcr.io/${GITHUB_REPOSITORY}-rag-ops:${IMAGE_TAG}"

x-airflow-worker-gpu-build: &airflow-worker-gpu-build
  context: ${PROJECT_ROOT}
  dockerfile: infra/docker/airflow-worker-gpu/Dockerfile

x-airflow-worker-gpu-image: &airflow-worker-gpu-image "ghcr.io/${GITHUB_REPOSITORY}-airflow-worker-gpu:${IMAGE_TAG}"

x-airflow-common-volumes: &airflow-common-volumes
  - ${PROJECT_ROOT}/dags:/opt/airflow/dags
  - ${PROJECT_ROOT}:/opt/airflow/project
  - *shared-datasets-volume
  - *shared-rag-data-volume
  - *shared-training-artifacts-volume
  - *shared-dvc-config-volume
  - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
  - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro
  - airflow_logs:/opt/airflow/logs

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    # Docker default shm is 64 MB; PostgreSQL needs more for shared buffers.
    shm_size: 256m

    # Limit WAL / checkpoint disk usage to prevent "No space left on device".
    command:
      - postgres
      - -c
      - max_wal_size=512MB
      - -c
      - min_wal_size=64MB
      - -c
      - wal_keep_size=0
      - -c
      - checkpoint_completion_target=0.9

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:${NETWORK__POSTGRES__HOST_PORT}:5432"

    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - mlflow_db_net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    image: "ghcr.io/${GITHUB_REPOSITORY}-mlflow:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/mlflow/Dockerfile

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_BACKEND_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_DB}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
      # S3 credentials (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "127.0.0.1:${NETWORK__MLFLOW__HOST_PORT}:5000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_DB}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
      - --allowed-hosts
      - ${MLFLOW_SERVER_ALLOWED_HOSTS}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - mlflow_db_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # LoRA adapter sync
  # Downloads aliased adapters from MLflow Model Registry and
  # hot-loads them into the running vLLM via its REST API.
  # =====================
  vllm-adapter-sync:
    image: "ghcr.io/${GITHUB_REPOSITORY}-adapter-sync:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/adapter-sync/Dockerfile

    environment:
      <<: [*network-env, *config-path-env, *runtime-secret-env, *s3-client-env, *postgres-client-env, *rabbitmq-client-env]

    volumes:
      - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
      - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro
      - ${SHARED_ROOT}/assets/adapters:/adapters:rw

    depends_on:
      vllm:
        condition: service_healthy
      mlflow:
        condition: service_healthy

    networks:
      - mlflow_db_net
      - backend_net

    logging: *default-logging
    restart: "no"

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:v0.16.0

    environment:
      HF_HOME: /models/.cache
      # Prioritise host-injected NVIDIA driver libs over the CUDA compat stubs
      # bundled inside the image (prevents Error 803 when host driver is newer).
      LD_LIBRARY_PATH: /lib/x86_64-linux-gnu:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
      # Allow loading/unloading LoRA adapters at runtime via the API
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: ${VLLM__ALLOW_RUNTIME_LORA_UPDATING}

    command: [
      "--model", "${VLLM__MODEL}",
      "--dtype", "${VLLM__DTYPE}",
      "--tensor-parallel-size", "${VLLM__GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM__GPU_UTILIZATION}",
      "--max-num-seqs", "${VLLM__MAX_NUM_SEQS}",
      "--max-num-batched-tokens", "${VLLM__MAX_NUM_BATCHED_TOKENS}",
      "--kv-cache-dtype", "${VLLM__KV_CACHE_DTYPE}",
      "--quantization", "${VLLM__QUANTIZATION}",
      "--enable-lora",
      "--max-loras", "${VLLM__MAX_LORAS}",
      "--max-lora-rank", "${VLLM__MAX_LORA_RANK}",
      "--host", "0.0.0.0",
      "--port", "${NETWORK__VLLM__INTERNAL_PORT}"
    ]

    ports:
      - "127.0.0.1:${NETWORK__VLLM__HOST_PORT}:${NETWORK__VLLM__INTERNAL_PORT}"

    volumes:
      - ${SHARED_ROOT}/assets/models:/models:rw
      - ${SHARED_ROOT}/assets/adapters:/adapters:rw

    depends_on:
      mlflow:
        condition: service_healthy

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM__GPU_COUNT}
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NETWORK__VLLM__INTERNAL_PORT}/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Qdrant Vector Database
  # =====================
  qdrant:
    image: qdrant/qdrant:v1.17.0

    ports:
      - "127.0.0.1:${NETWORK__QDRANT_HTTP__HOST_PORT}:6333"
      - "127.0.0.1:${NETWORK__QDRANT_GRPC__HOST_PORT}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # RabbitMQ Message Broker
  # =====================
  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "127.0.0.1:${NETWORK__RABBITMQ_AMQP__HOST_PORT}:5672"
      - "127.0.0.1:${NETWORK__RABBITMQ_MGMT__HOST_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ${PROJECT_ROOT}/infra/docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-path-prefix.conf:ro
      - ${PROJECT_ROOT}/infra/docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Redis (Pub/Sub for streaming)
  # =====================
  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:${NETWORK__REDIS__HOST_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Redpanda (Kafka-compatible event streaming)
  # =====================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9

    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${NETWORK__REDPANDA_KAFKA__HOST_PORT}
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:${NETWORK__REDPANDA_PANDAPROXY__HOST_PORT}
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info

    ports:
      - "127.0.0.1:${NETWORK__REDPANDA_KAFKA__HOST_PORT}:19092"
      - "127.0.0.1:${NETWORK__REDPANDA_SCHEMA_REGISTRY__HOST_PORT}:18081"
      - "127.0.0.1:${NETWORK__REDPANDA_PANDAPROXY__HOST_PORT}:18082"
      - "127.0.0.1:${NETWORK__REDPANDA_ADMIN__HOST_PORT}:9644"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Redpanda Console (Kafka topic inspection)
  # =====================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.7.4

    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'

    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]

    ports:
      - "127.0.0.1:${NETWORK__REDPANDA_CONSOLE__HOST_PORT}:8080"

    depends_on:
      redpanda:
        condition: service_started

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Embeddings Service (sentence-transformers)
  # =====================
  embeddings:
    image: "ghcr.io/${GITHUB_REPOSITORY}-embeddings:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/embeddings/Dockerfile

    environment:
      <<: [*network-env, *observability-env, *config-path-env, *runtime-secret-env, *postgres-client-env, *rabbitmq-client-env]

    volumes: *config-volumes

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Reranker Service (cross-encoder)
  # =====================
  reranker:
    image: "ghcr.io/${GITHUB_REPOSITORY}-reranker:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/reranker/Dockerfile

    environment:
      <<: [*network-env, *observability-env, *config-path-env, *runtime-secret-env, *postgres-client-env, *rabbitmq-client-env]

    volumes: *config-volumes

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Celery Worker (LLM Task Execution)
  # =====================
  celery-worker:
    image: "ghcr.io/${GITHUB_REPOSITORY}-celery:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/celery/Dockerfile

    environment:
      <<: [*network-env, *observability-env, *config-path-env, *runtime-secret-env, *postgres-client-env, *rabbitmq-client-env]

    volumes: *config-volumes

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      vllm:
        condition: service_healthy

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow Celery Worker
  # Runs ALL DAG tasks: evaluation (bert-score, torch CPU),
  # RAG data pipelines (arxiv, qdrant, dvc), collection cleanup.
  # Uses a fat image with all task dependencies pre-installed.
  # =====================
  airflow-worker:
    image: *airflow-worker-image
    build: *airflow-worker-build
    # Low concurrency: eval tasks (BERTScore, etc.) load large models into RAM.
    # The default (== CPU count) causes OOM kills.
    command: celery worker --concurrency 2
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - ${PROJECT_ROOT}:/opt/airflow/project
      - *shared-datasets-volume
      - *shared-rag-data-volume
      - *shared-training-artifacts-volume
      - *shared-dvc-config-volume
      - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
      - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      # yamllint enable rule:line-length
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
      - sandbox_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow GPU Worker (Celery) – routes the "gpu" queue
  # Uses a separate Dockerfile with CUDA-enabled torch and training deps.
  # Concurrency 1: each training job needs exclusive GPU access.
  # =====================
  airflow-worker-gpu:
    image: *airflow-worker-gpu-image
    build: *airflow-worker-gpu-build
    command: celery worker --queues gpu --concurrency 1
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - ${PROJECT_ROOT}:/opt/airflow/project
      - *shared-datasets-volume
      - *shared-rag-data-volume
      - *shared-training-artifacts-volume
      - *shared-dvc-config-volume
      - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
      - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      # yamllint enable rule:line-length
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
      - sandbox_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Code execution sandbox sidecar
  # =====================
  code-sandbox:
    image: "ghcr.io/${GITHUB_REPOSITORY}-code-sandbox:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/code-sandbox/Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      SANDBOX_PORT: ${NETWORK__CODE_SANDBOX__INTERNAL_PORT}
    cpus: 1.0
    mem_limit: 256m
    # Isolated network — only reachable by airflow-worker, no internet.
    networks:
      - sandbox_net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen(f'http://localhost:{os.environ[\"SANDBOX_PORT\"]}/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    image: "ghcr.io/${GITHUB_REPOSITORY}-gateway:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/gateway/Dockerfile

    environment:
      <<: [*network-env, *observability-env, *config-path-env, *runtime-secret-env, *postgres-client-env, *rabbitmq-client-env]

    volumes: *config-volumes

    ports:
      - "127.0.0.1:${NETWORK__GATEWAY__HOST_PORT}:9000"

    depends_on:
      vllm:
        condition: service_healthy
      vllm-adapter-sync:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - backend_net
      - frontend_net
      - mlflow_db_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    image: "ghcr.io/${GITHUB_REPOSITORY}-ui:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/ui/Dockerfile

    environment:
      <<: [*network-env, *config-path-env, *runtime-secret-env, *postgres-client-env, *rabbitmq-client-env]

    volumes: *config-volumes

    ports:
      - "127.0.0.1:${NETWORK__UI__HOST_PORT}:8501"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Flower (Celery Monitoring)
  # =====================
  flower:
    image: mher/flower:2.0

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${NETWORK__RABBITMQ_AMQP__INTERNAL_HOST}:${NETWORK__RABBITMQ_AMQP__INTERNAL_PORT}//
      FLOWER_PORT: ${NETWORK__FLOWER__INTERNAL_PORT}
      FLOWER_URL_PREFIX: ${PUBLIC__FLOWER_PATH}

    ports:
      - "127.0.0.1:${NETWORK__FLOWER__HOST_PORT}:5555"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # RedisInsight (Redis Monitoring)
  # =====================
  redisinsight:
    image: redis/redisinsight:3.2.0

    environment:
      RI_PROXY_PATH: ${PUBLIC__REDISINSIGHT_PATH}

    ports:
      - "127.0.0.1:${NETWORK__REDISINSIGHT__HOST_PORT}:5540"

    volumes:
      - redisinsight_data:/data

    depends_on:
      redis:
        condition: service_healthy

    logging: *default-logging

    networks:
      - backend_net

  # =====================
  # Node Exporter (Host CPU / RAM / Disk / Network)
  # =====================
  node-exporter:
    image: prom/node-exporter:v1.8.2

    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'

    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # NVIDIA DCGM Exporter (Host GPU metrics)
  # =====================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.4.1-4.6.0-ubuntu22.04

    cap_add:
      - SYS_ADMIN

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Prometheus (metrics collection)
  # =====================
  prometheus:
    image: prom/prometheus:v3.4.0

    volumes:
      - ${PROJECT_ROOT}/infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

    ports:
      - "127.0.0.1:${NETWORK__PROMETHEUS__HOST_PORT}:9090"

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # ClickHouse (analytics storage)
  # =====================
  clickhouse:
    image: clickhouse/clickhouse-server:25.11

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ${PROJECT_ROOT}/infra/clickhouse/init:/docker-entrypoint-initdb.d:ro

    ports:
      - "127.0.0.1:${NETWORK__CLICKHOUSE_HTTP__HOST_PORT}:8123"
      - "127.0.0.1:${NETWORK__CLICKHOUSE_NATIVE__HOST_PORT}:9000"

    depends_on:
      redpanda:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Loki (log storage)
  # =====================
  loki:
    image: grafana/loki:3.5.1

    command:
      - -config.file=/etc/loki/loki.yaml

    volumes:
      - ${PROJECT_ROOT}/infra/docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki

    ports:
      - "127.0.0.1:${NETWORK__LOKI__HOST_PORT}:3100"

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Tempo (trace storage)
  # =====================
  tempo:
    image: grafana/tempo:2.8.1

    command:
      - -config.file=/etc/tempo/tempo.yaml

    volumes:
      - ${PROJECT_ROOT}/infra/docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

    ports:
      - "127.0.0.1:${NETWORK__TEMPO__HOST_PORT}:3200"

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # OpenTelemetry Collector (OTLP ingress)
  # =====================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0

    command:
      - --config=/etc/otelcol/config.yaml

    volumes:
      - ${PROJECT_ROOT}/infra/docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

    ports:
      - "127.0.0.1:${NETWORK__OTEL_COLLECTOR_GRPC__HOST_PORT}:4317"
      - "127.0.0.1:${NETWORK__OTEL_COLLECTOR_HTTP__HOST_PORT}:4318"

    depends_on:
      tempo:
        condition: service_started

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Grafana Alloy (Docker logs to Loki)
  # =====================
  alloy:
    image: grafana/alloy:v1.10.2

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

    volumes:
      - ${PROJECT_ROOT}/infra/docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "127.0.0.1:${NETWORK__ALLOY__HOST_PORT}:12345"

    depends_on:
      loki:
        condition: service_started

    networks:
      - backend_net

    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Grafana (Analytics & Observability UI)
  # =====================
  grafana:
    image: grafana/grafana-oss:13.0.1

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${PUBLIC__BASE_URL}${PUBLIC__GRAFANA_PATH}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # Passed through for provisioning interpolation in datasources.yml
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}

    volumes:
      - ${PROJECT_ROOT}/infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${PROJECT_ROOT}/infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    ports:
      - "127.0.0.1:${NETWORK__GRAFANA__HOST_PORT}:3000"

    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - backend_net
      - mlflow_db_net

    logging: *default-logging
    restart: unless-stopped

  # Airflow – database migration & admin user (one-shot)
  # =====================
  airflow-init:
    image: *airflow-common-image
    build: *airflow-common-build
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        python <<'PYEOF'
        import os
        import psycopg2
        from psycopg2 import sql
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        conn = psycopg2.connect(host=os.environ["PG_HOST"], port=int(os.environ["PG_PORT"]),
                                user=os.environ["PG_USER"],
                                password=os.environ["PG_PASSWORD"],
                                dbname=os.environ["PG_DB"])
        conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = conn.cursor()
        db = os.environ["AIRFLOW_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
            print("Created database " + db)
        else:
            print("Database " + db + " already exists")
        # Also create the application database.
        app_db = os.environ["APP_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (app_db,))
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(app_db)))
            print("Created database " + app_db)
        else:
            print("Database " + app_db + " already exists")
        conn.close()
        PYEOF
        # SimpleAuthManager stores credentials in a JSON file.
        # Seed it from .env so credentials stay deterministic across restarts.
        python <<'PYEOF'
        import json
        import os
        from pathlib import Path

        username = os.environ["AIRFLOW_ADMIN_USER"]
        password = os.environ["AIRFLOW_ADMIN_PASSWORD"]
        path = Path(os.environ["AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE"])
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(json.dumps({username: password}) + "\n", encoding="utf-8")
        print(f"Seeded SimpleAuthManager password file at {path}")
        PYEOF
        airflow db migrate
        # Airflow 3 uses simple auth manager by default (users from config).
        # If FAB users CLI is available, keep compatibility with old flow.
        if airflow users --help >/dev/null 2>&1; then
          airflow users create \
            --username $${AIRFLOW_ADMIN_USER} \
            --password $${AIRFLOW_ADMIN_PASSWORD} \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com || echo "Admin user already exists; continuing."
        else
          echo "Skipping legacy 'airflow users create' (not available in this Airflow build)."
          echo "Configured simple auth manager user via AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS."
        fi
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CELERY__BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${NETWORK__RABBITMQ_AMQP__INTERNAL_HOST}:${NETWORK__RABBITMQ_AMQP__INTERNAL_PORT}//
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${NETWORK__AIRFLOW_WEBSERVER__SCHEME}://${NETWORK__AIRFLOW_WEBSERVER__INTERNAL_HOST}:${NETWORK__AIRFLOW_WEBSERVER__INTERNAL_PORT}${PUBLIC__AIRFLOW_PATH}/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API_AUTH__JWT_SECRET}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_SIMPLE_AUTH_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json
      # Postgres connection for automatic DB creation
      PG_HOST: ${NETWORK__POSTGRES__INTERNAL_HOST}
      PG_PORT: ${NETWORK__POSTGRES__INTERNAL_PORT}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${POSTGRES_AIRFLOW_DB}
      APP_DB_NAME: ${POSTGRES_APP_DB}
    volumes:
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: "no"

  # =====================
  # Airflow Webserver
  # =====================
  airflow-webserver:
    image: *airflow-common-image
    build: *airflow-common-build
    command: api-server
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "true"
      AIRFLOW__API__BASE_URL: ${PUBLIC__BASE_URL}${PUBLIC__AIRFLOW_PATH}
    ports:
      - "127.0.0.1:${NETWORK__AIRFLOW_WEBSERVER__HOST_PORT}:8080"
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # Airflow Scheduler (CeleryExecutor)
  # =====================
  airflow-dag-processor:
    image: *airflow-common-image
    build: *airflow-common-build
    command: dag-processor
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  airflow-scheduler:
    image: *airflow-common-image
    build: *airflow-common-build
    command: scheduler
    environment:
      <<: *airflow-common-env
    volumes: *airflow-common-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - mlflow_db_net
      - backend_net
    logging: *default-logging
    restart: unless-stopped

  # =====================
  # RAG Operations Runner
  # One-shot shell/CLI entry point for manual RAG control-plane operations.
  # Uses the same dependency image and mounted project/data roots as the
  # Airflow worker, but does not run a worker process by default.
  #
  # Example:
  #   docker compose --profile ops --env-file .env -f infra/compose/docker-compose.yaml run --rm rag-ops \
  #     python -m rag.cli.app alias apply pytorch_reference challenger
  # =====================
  rag-ops:
    profiles: ["ops"]
    image: *rag-ops-image
    build: *rag-ops-build
    working_dir: /opt/airflow/project
    entrypoint: []
    command: ["python", "-m", "rag.cli.app", "--help"]
    environment:
      <<: *airflow-common-env
      PYTHONPATH: /opt/airflow/project:/opt/airflow/project/src
    volumes: *airflow-common-volumes
    depends_on:
      qdrant:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      reranker:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - mlflow_db_net
      - backend_net
      - sandbox_net
    logging: *default-logging
    restart: "no"

  # =====================
  # JupyterLab
  # =====================
  jupyter:
    image: "ghcr.io/${GITHUB_REPOSITORY}-jupyter:${IMAGE_TAG}"
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/jupyter/Dockerfile
    command: start-notebook.py --ServerApp.base_url=${PUBLIC__JUPYTER_PATH}
    environment:
      <<: [*network-env, *config-path-env, *runtime-secret-env, *s3-client-env, *postgres-client-env, *rabbitmq-client-env]
      CONTAINER__PROJECT_ROOT: /home/jovyan
      PYTHONPATH: /home/jovyan:/home/jovyan/src
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      # Shared services are reached over the internal Docker network.
      # PostgreSQL — used by diagnostics/analytics notebooks
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NETWORK__POSTGRES__INTERNAL_HOST}:${NETWORK__POSTGRES__INTERNAL_PORT}/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${NETWORK__JUPYTER__HOST_PORT}:8888"
    volumes:
      - ${PROJECT_ROOT}/runtime.toml:/opt/agent/runtime.toml:ro
      - ${PROJECT_ROOT}/catalog.toml:/opt/agent/catalog.toml:ro
      - ${PROJECT_ROOT}/src:/home/jovyan/src:ro
      - ${PROJECT_ROOT}/experiments:/home/jovyan/experiments:rw
      - ${SHARED_ROOT}/assets:/home/jovyan/assets:rw
      - ${PROJECT_ROOT}/dags:/home/jovyan/dags:rw
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/jupyter/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
      - mlflow_db_net   # allows direct http://mlflow:5000 access without credentials
    logging: *default-logging
    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  redpanda_data:
  redisinsight_data:
  grafana_data:
  prometheus_data:
  clickhouse_data:
  loki_data:
  tempo_data:
  airflow_logs:

# =====================
# Docker networks
# =====================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  mlflow_db_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true   # no outbound internet access from this network
