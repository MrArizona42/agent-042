services:

  # =====================
  # PostgreSQL backend
  # =====================
  postgres:
    image: postgres:15

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - mlflow_pg_data:/var/lib/postgresql/data

    networks:
      - mlflow_db_net

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # =====================
  # MLflow Tracking Server
  # =====================
  mlflow:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/mlflow/Dockerfile

    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS}
      MLFLOW_BACKEND_URI: ${MLFLOW_BACKEND_URI}
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT}
      # S3 credentials (Yandex Object Storage)
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    ports:
      - "${MLFLOW_PORT}:5000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - ${MLFLOW_BACKEND_URI}
      - --default-artifact-root
      - ${MLFLOW_ARTIFACT_ROOT}
      # - --serve-artifacts

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - mlflow_db_net

    restart: unless-stopped

  # =====================
  # vLLM OpenAI-compatible server
  # =====================
  vllm:
    image: vllm/vllm-openai:latest

    environment:
      VLLM_MODEL: ${VLLM_MODEL}
      VLLM_DTYPE: ${VLLM_DTYPE}
      VLLM_QUANT: ${VLLM_QUANT}
      VLLM_GPU_UTIL: ${VLLM_GPU_UTIL}
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE}
      HF_HOME: /models/.cache

    command: [
      "--model", "${VLLM_MODEL}",
      "--dtype", "${VLLM_DTYPE}",
      "--tensor-parallel-size", "${VLLM_GPU_COUNT}",
      "--gpu-memory-utilization", "${VLLM_GPU_UTIL}",
      "--kv-cache-dtype", "${VLLM_KV_CACHE_DTYPE}",
      "--quantization", "${VLLM_QUANT}",
      "--enable-lora",
      "--max-loras", "${VLLM_MAX_LORAS}",
      "--max-lora-rank", "${VLLM_MAX_LORA_RANK}",
      "--host", "0.0.0.0",
      "--port", "8000"
    ]

    ports:
      - "${VLLM_PORT}:8000"

    # Mount repo models and downloaded adapters
    volumes:
      - ${PROJECT_ROOT}/assets/models:/models:rw
      - ${PROJECT_ROOT}/assets/adapters:/adapters:ro

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT}
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Qdrant Vector Database
  # =====================
  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "${QDRANT_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend_net

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  # =====================
  # RabbitMQ Message Broker
  # =====================
  rabbitmq:
    image: rabbitmq:3-management

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # =====================
  # Redis (Pub/Sub for streaming)
  # =====================
  redis:
    image: redis:7-alpine

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - backend_net

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # =====================
  # Celery Worker (LLM Task Execution)
  # =====================
  celery-worker:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/celery/Dockerfile

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0
      VLLM_BASE_URL: http://vllm:8000
      VLLM_MODEL: ${VLLM_MODEL}

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # Agent Gateway (FastAPI)
  # =====================
  gateway:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/gateway/Dockerfile

    environment:
      GATEWAY_VLLM_BASE_URL: ${GATEWAY_VLLM_BASE_URL}
      GATEWAY_DEFAULT_MODEL: ${VLLM_MODEL}
      GATEWAY_QDRANT_HOST: ${GATEWAY_QDRANT_HOST}
      GATEWAY_QDRANT_PORT: ${GATEWAY_QDRANT_PORT}
      GATEWAY_RAG_ENABLED: ${GATEWAY_RAG_ENABLED}
      GATEWAY_EMBEDDING_MODEL: ${GATEWAY_EMBEDDING_MODEL}
      GATEWAY_ASYNC_ENABLED: ${GATEWAY_ASYNC_ENABLED}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      REDIS_URL: redis://redis:6379/0

    ports:
      - "${GATEWAY_PORT}:9000"

    depends_on:
      vllm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    networks:
      - backend_net
      - frontend_net

    restart: unless-stopped

  # =====================
  # Agent UI (Streamlit)
  # =====================
  ui:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: infra/docker/ui/Dockerfile

    environment:
      GATEWAY_URL: ${GATEWAY_URL}

    ports:
      - "${UI_PORT}:8501"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend_net

    restart: unless-stopped

  # =====================
  # Flower (Celery Monitoring)
  # =====================
  flower:
    image: mher/flower:2.0

    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
      FLOWER_PORT: 5555

    ports:
      - "${FLOWER_PORT}:5555"

    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - backend_net

    restart: unless-stopped

  # =====================
  # RedisInsight (Redis Monitoring)
  # =====================
  redisinsight:
    image: redis/redisinsight:latest

    ports:
      - "${REDISINSIGHT_PORT}:5540"

    volumes:
      - redisinsight_data:/data

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - backend_net

  # Airflow – database migration & admin user (one-shot)
  # =====================
  airflow-init:
    image: apache/airflow:2.10.4
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python <<'PYEOF'
        import os
        import psycopg2
        from psycopg2 import sql
        from psycopg2.extensions import ISOLATION_LEVEL_AUTOCOMMIT
        conn = psycopg2.connect(host="postgres", port=5432,
                                user=os.environ["PG_USER"],
                                password=os.environ["PG_PASSWORD"],
                                dbname=os.environ["PG_DB"])
        conn.set_isolation_level(ISOLATION_LEVEL_AUTOCOMMIT)
        cur = conn.cursor()
        db = os.environ["AIRFLOW_DB_NAME"]
        cur.execute("SELECT 1 FROM pg_database WHERE datname = %s", (db,))
        if not cur.fetchone():
            cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db)))
            print("Created database " + db)
        else:
            print("Database " + db + " already exists")
        conn.close()
        PYEOF
        airflow db migrate &&
        airflow users create \
          --username $${AIRFLOW_ADMIN_USER} \
          --password $${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      # Postgres connection for automatic DB creation
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlflow_db_net
    restart: "no"

  # =====================
  # Airflow Webserver
  # =====================
  airflow-webserver:
    image: apache/airflow:2.10.4
    command: webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ports:
      - "${AIRFLOW_PORT}:8080"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # Airflow Scheduler (LocalExecutor)
  # =====================
  airflow-scheduler:
    image: apache/airflow:2.10.4
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ${PROJECT_ROOT}/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mlflow_db_net
      - backend_net
    restart: unless-stopped

  # =====================
  # JupyterLab
  # =====================
  jupyter:
    image: quay.io/jupyter/minimal-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - ${PROJECT_ROOT}/notebooks:/home/jovyan/work
      - ${PROJECT_ROOT}/src:/home/jovyan/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/api || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
    restart: unless-stopped

# =====================
# Persistent volumes
# =====================
volumes:
  mlflow_pg_data:
  qdrant_data:
  rabbitmq_data:
  redis_data:
  redisinsight_data:
  airflow_logs:

# =====================
# Docker networks
# =====================
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge
  mlflow_db_net:
    driver: bridge
