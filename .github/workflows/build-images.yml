name: Build Images

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch that should contain the target commit
        required: true
        type: string
      sha:
        description: Exact commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve build target
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      branch_slug: ${{ steps.resolve.outputs.branch_slug }}
      sha: ${{ steps.resolve.outputs.sha }}
      sha_short: ${{ steps.resolve.outputs.sha_short }}
      repository_lower: ${{ steps.resolve.outputs.repository_lower }}

    steps:
      - name: Resolve source ref
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            branch="${{ github.ref_name }}"
            sha="${{ github.sha }}"
          else
            branch="${{ inputs.branch }}"
            sha="${{ inputs.sha }}"
          fi

          branch_slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9]+#-#g; s#(^-+|-+$)##g')"
          sha_short="${sha:0:12}"
          repository_lower="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$branch_slug" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"
          echo "repository_lower=$repository_lower" >> "$GITHUB_OUTPUT"

      - name: Checkout branch for validation
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.branch }}
          fetch-depth: 0

      - name: Verify requested SHA belongs to branch
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${{ steps.resolve.outputs.sha }}^{commit}"
          git merge-base --is-ancestor "${{ steps.resolve.outputs.sha }}" "origin/${{ steps.resolve.outputs.branch }}"

  publish:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: adapter-sync
            dockerfile: infra/docker/adapter-sync/Dockerfile
          - name: airflow
            dockerfile: infra/docker/airflow/Dockerfile
          - name: airflow-worker
            dockerfile: infra/docker/airflow-worker/Dockerfile
          - name: airflow-worker-gpu
            dockerfile: infra/docker/airflow-worker-gpu/Dockerfile
          - name: celery
            dockerfile: infra/docker/celery/Dockerfile
          - name: code-sandbox
            dockerfile: infra/docker/code-sandbox/Dockerfile
          - name: embeddings
            dockerfile: infra/docker/embeddings/Dockerfile
          - name: gateway
            dockerfile: infra/docker/gateway/Dockerfile
          - name: jupyter
            dockerfile: infra/docker/jupyter/Dockerfile
          - name: mlflow
            dockerfile: infra/docker/mlflow/Dockerfile
          - name: reranker
            dockerfile: infra/docker/reranker/Dockerfile
          - name: ui
            dockerfile: infra/docker/ui/Dockerfile

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.repository_lower }}-${{ matrix.image.name }}:${{ needs.prepare.outputs.branch_slug }}-${{ needs.prepare.outputs.sha_short }}
            ghcr.io/${{ needs.prepare.outputs.repository_lower }}-${{ matrix.image.name }}:${{ needs.prepare.outputs.branch_slug }}-latest
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

      - name: Summarize published tags
        shell: bash
        run: |
          {
            echo "### Published image"
            echo
            echo "- ghcr.io/${{ needs.prepare.outputs.repository_lower }}-${{ matrix.image.name }}:${{ needs.prepare.outputs.branch_slug }}-${{ needs.prepare.outputs.sha_short }}"
            echo "- ghcr.io/${{ needs.prepare.outputs.repository_lower }}-${{ matrix.image.name }}:${{ needs.prepare.outputs.branch_slug }}-latest"
          } >> "$GITHUB_STEP_SUMMARY"
